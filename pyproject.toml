[project]
name = "cellular-gaits"
version = "0.1.0"
description = "Neural cellular automaton motor controller for a Flygym fruit fly, evolved with CMA-ES."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flygym==2.0.1",
    "torch>=2.5,<3.0",
    "cma>=3.3,<4.0",
    "gymnasium[classic-control]>=1.3.0",
    "numpy>=1.26,<3.0",
    "matplotlib>=3.8,<4.0",
    "imageio>=2.34,<3.0",
    "imageio-ffmpeg>=0.5,<1.0",
    "brian2>=2.10.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "joblib>=1.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellular_gaits"]
